<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Nights Cover Studio</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="studio">
  <aside class="rail">
    <header class="brand">
      <h1>Vice Nights</h1>
      <p class="tag">Cover Studio — your photos, poster style, straight to PNG. Nothing leaves this machine.</p>
    </header>

    <section class="group">
      <h2>Caption</h2>
      <label class="field">Title
        <input id="titleText" type="text" maxlength="42" value="Vice Nights">
      </label>
      <label class="field">Subtitle
        <input id="subtitleText" type="text" maxlength="52" value="one city, no brakes">
      </label>
      <div class="presetRow" id="presetRow"></div>
    </section>

    <section class="group">
      <h2>Layout &amp; grade</h2>
      <div class="segRow" id="layoutRow"></div>
      <div class="segRow" id="gradeRow"></div>
      <div class="segRow" id="sizeRow"></div>
    </section>

    <section class="group">
      <h2>Panels</h2>
      <div class="rowButtons">
        <label class="btn fileBtn">Fill every panel with one photo
          <input id="fillAll" type="file" accept="image/*" hidden>
        </label>
      </div>
      <div id="panelCards"></div>
    </section>

    <section class="group">
      <h2>Export PNG</h2>
      <div class="exportRow">
        <button type="button" data-export="1080x1080">Square 1080 × 1080</button>
        <button type="button" data-export="1080x1350">Portrait 1080 × 1350</button>
        <button type="button" data-export="1920x1080">Wide 1920 × 1080</button>
      </div>
      <p id="statusLine" role="status"></p>
    </section>
  </aside>

  <section class="stage">
    <div class="canvasWrap" id="canvasWrap">
      <canvas id="preview" width="1080" height="1080"></canvas>
      <div class="focalPin" id="focalPin" title="Drag to set the focal point"></div>
    </div>
    <p class="hint">Pick a panel card, load a photo, then drag the pink pin onto the face — the crop follows it.</p>
  </section>
</main>
<script type="module" src="./src/studio.js"></script>
</body>
</html>
